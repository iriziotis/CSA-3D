[tox]
envlist = py38,py39,py310,py311,lint,type

[testenv]
deps = -r{toxinidir}/requirements-dev.txt
commands = pytest tests/ -v --tb=short

[testenv:lint]
commands =
    isort --check-only csa3d tests
    black --check csa3d tests
    flake8 csa3d tests

[testenv:type]
commands = mypy csa3d --ignore-missing-imports

[testenv:format]
commands =
    isort csa3d tests
    black csa3d tests

[testenv:docs]
deps = -r{toxinidir}/requirements-dev.txt
       sphinx>=6.0
       sphinx-rtd-theme>=1.2
       myst-parser>=0.19
commands = sphinx-build -W -b html docs docs/_build/html

[pytest]
testpaths = tests
addopts = --strict-markers -v
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
