# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2/

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"

python:
  version: 3.11
  install:
    - requirements: docs/requirements.txt

sphinx:
  configuration: docs/conf.py
  builder: html
  failOnWarning: false

# Redirect old documentation URLs to new RTD URLs if migrating
redirects:
  documentation: api/

# Optional: enable PDF builds
# formats:
#   - pdf
#   - epub
